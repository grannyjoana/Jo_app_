<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="營業員試溫習通">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>營業員試溫習通</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mut:#6b7686;--pri:#0f766e;--bd:#e3e7ec;--nav:64px}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#1a222c;--ink:#e8edf2;--mut:#93a0b0;--bd:#2a3542}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang HK",sans-serif}
main{padding:16px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom));padding-top:calc(16px + env(safe-area-inset-top))}
section{display:none}section.on{display:block}
h1{font-size:22px;margin:0 0 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:44px;font-weight:700;color:var(--pri);line-height:1.1}
.mut{color:var(--mut);font-size:14px}
input[type=date],input[type=search]{font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);width:100%}
textarea{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--ink);margin-bottom:8px}
button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
label.ck{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
label.ck input{width:22px;height:22px;accent-color:var(--pri)}
a.link,.row{display:block;padding:12px 0;border-top:1px solid var(--bd);color:var(--pri);text-decoration:none}
.row{color:var(--ink)}.row b{color:var(--pri)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips button.on{background:var(--pri);color:#fff}
.q{font-size:18px;min-height:90px}.a{display:none;border-top:1px dashed var(--bd);padding-top:10px;margin-top:10px}
.a.on{display:block}.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px}
.opt.good{background:#16a34a;color:#fff;border-color:#16a34a}
.opt.bad{background:#dc2626;color:#fff;border-color:#dc2626}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:12px;padding:0}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
#view{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);flex-direction:column}
#vbar{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;border-bottom:1px solid var(--bd);background:var(--card)}
#vbar span{flex:1;text-align:center;font-size:14px}
#vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
@media(orientation:landscape) and (max-height:520px){
 nav{top:0;right:auto;width:calc(88px + env(safe-area-inset-left));height:auto;flex-direction:column;border-top:0;border-right:1px solid var(--bd);padding:env(safe-area-inset-top) 0 0 env(safe-area-inset-left)}
 main{margin-left:calc(88px + env(safe-area-inset-left));padding-bottom:24px;max-width:760px}
}
</style>
</head>
<body>
<main>
 <section id="home" class="on">
  <h1>主頁</h1>
  <div class="card"><h2>考試倒數</h2><div class="big" id="days">--</div>
   <p class="mut" id="dtxt">請揀考試日期</p><input type="date" id="exam"></div>
  <div class="card"><h2>溫習清單</h2><div id="list"></div><p class="mut" id="prog"></p></div>
  <div class="card"><h2>備份(進度、收藏、匯入習題,唔包 PDF)</h2>
   <button onclick="exp()">匯出</button>
   <button onclick="$('imp').click()">匯入</button>
   <input type="file" id="imp" accept=".json" style="display:none"></div>
 </section>

 <section id="topics"><h1>專項</h1>
  <div class="chips" id="cats"></div>
  <div class="card" id="fc"></div>
  <p class="mut" id="fstat"></p>
  <label class="ck"><input type="checkbox" id="auto" onchange="S.auto=this.checked;save()">答啱自動下一題</label>
  <div class="card"><h2>匯入習題</h2>
   <p class="mut">問答:類別|題目|答案|出處<br>MC:類別|題目|選項一;選項二;選項三|B|出處</p>
   <textarea id="ib" rows="5" placeholder="貼上習題"></textarea>
   <input type="file" id="qf" accept=".txt,.json,.csv">
   <div class="btns"><button class="p" onclick="doImp()">匯入</button>
   <button onclick="expMine()">匯出習題</button><button onclick="clrMine()">清空</button></div>
   <p class="mut" id="istat"></p></div>
 </section>

 <section id="mine"><h1>我的資料</h1>
  <div class="card"><h2>上傳 PDF</h2>
   <input type="file" id="pdf" accept="application/pdf" multiple>
   <p class="mut" id="pstat">PDF 只存喺你部手機,唔會上傳。</p></div>
  <div class="card"><h2>關鍵字搜尋</h2>
   <input type="search" id="kw" placeholder="例如:查冊"><div class="btns"><button class="p" onclick="search()">搜尋</button></div>
   <div id="res"></div></div>
  <div class="card"><h2>⭐ 收藏</h2><div id="favs"></div></div>
  <div class="card"><h2>已存檔案</h2><div id="files"></div></div>
 </section>

 <section id="portal"><h1>官方入口</h1><div class="card" id="links"></div></section>
 <section id="quiz"><h1>模擬試題</h1><div class="card">計時、兩部分分開計分(v0.9,開發中)</div></section>
</main>
<nav id="nav"></nav>

<div id="view">
 <div id="vbar"><button onclick="closeV()">✕</button><button onclick="mv(-1)">◀</button>
  <span id="vt"></span><button onclick="mv(1)">▶</button><button id="vs" onclick="favCur()">☆</button></div>
 <div id="vbody"><canvas id="cv"></canvas></div>
</div>

<script src="lib/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="lib/pdf.worker.min.js";
const TABS=[["home","🏠","主頁"],["topics","🎯","專項"],["mine","📁","資料"],["portal","🔗","官方"],["quiz","✍️","模擬"]];
const CHECK=["對照官方營業員考試綱要,逐項剔","學習指引:前言、免責聲明","第一章 香港的地產代理行業","第二章 《地產代理條例》及附屬法例","第三章 其他規管法律及物業轉易程序","第四章 土地註冊、查冊及物業資料系統","第五章 樓宇知識、物業分類及物業管理","第七章 租契及租約事宜","附錄一 第四章附註","表格:物業資料表格(住宅買賣)","表格:出租資料表格(住宅出租)","表格:出售/購買/出租/承租 地產代理協議","做一次網上模擬試"];
const LINKS=[
["考試手冊頁(英文版)","https://www.eaa.org.hk/en-us/Examination/Examination-Handbook"],
["網上模擬試","https://eaa.org.hk/en-us/Examination/Online-Mock-Examination"],
["手冊 PDF(紙筆版,含營業員綱要)","https://www.eaa.org.hk/Portals/0/Sections/Exam/Handbook/PBE_HB_202609_eng.pdf"],
["手冊 PDF(電腦版,含營業員綱要)","https://eaa.org.hk/Portals/0/Sections/Exam/Handbook/CBE_HB_202609_eng.pdf"],
["通告目錄(待貼確實網址)","https://www.eaa.org.hk"],
["學習指引目錄(待貼確實網址)","https://www.eaa.org.hk"]];
const K="s牌v1",$=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=Object.assign({exam:"",done:{},cards:{},fav:[],my:[],auto:false},JSON.parse(localStorage.getItem(K)||"{}"));
const save=()=>localStorage.setItem(K,JSON.stringify(S));

/* ---------- 導航 ---------- */
function go(id){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==id));
 [...$("nav").children].forEach(b=>b.classList.toggle("on",b.dataset.t==id));history.replaceState(0,"","#"+id);
 if(id=="mine")listMine()}
$("nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join("");
$("links").innerHTML=LINKS.map(l=>`<a class="link" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join("");

/* ---------- 主頁 ---------- */
function render(){
 $("exam").value=S.exam;$("auto").checked=!!S.auto;
 if(S.exam){const d=Math.ceil((new Date(S.exam+"T00:00")-new Date().setHours(0,0,0,0))/864e5);
  $("days").textContent=d>0?d+" 日":d==0?"今日考試!":"已過期";$("dtxt").textContent="考試日期:"+S.exam}
 $("list").innerHTML=CHECK.map((c,i)=>`<label class="ck"><input type="checkbox" ${S.done[i]?"checked":""} onchange="tg(${i})">${c}</label>`).join("");
 const n=Object.values(S.done).filter(Boolean).length;$("prog").textContent=`完成 ${n} / ${CHECK.length}`}
function tg(i){S.done[i]=!S.done[i];save();render()}
$("exam").onchange=e=>{S.exam=e.target.value;save();render()};
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download="s牌備份.json";a.click()}
$("imp").onchange=async e=>{try{S=Object.assign(S,JSON.parse(await e.target.files[0].text()));save();render();initCats()}catch(x){alert("檔案唔啱")}};

/* ---------- 專項:閃卡 + MC ---------- */
let CARDS=[],cat="全部",deck=[],ci=0,locked=false;
const all=()=>CARDS.concat(S.my);
fetch("cards.json").then(r=>r.json()).then(j=>{CARDS=j}).catch(()=>{}).then(initCats);
function initCats(){const cs=["全部","未掌握",...new Set(all().map(c=>c.cat))];
 $("cats").innerHTML=cs.map(c=>`<button data-c="${esc(c)}" onclick="pick(this.dataset.c)">${esc(c)}</button>`).join("");
 pick(cs.includes(cat)?cat:"全部")}
function pick(c){cat=c;[...$("cats").children].forEach(b=>b.classList.toggle("on",b.dataset.c==c));
 deck=all().filter(x=>c=="全部"||(c=="未掌握"?S.cards[x.id]!=="ok":x.cat==c));
 for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
 ci=0;fcRender()}
function fcRender(){
 locked=false;
 if(!deck.length){$("fc").innerHTML="呢類冇題目 🎉";$("fstat").textContent="";return}
 const c=deck[ci],A=all(),L="ABCD",mc=Array.isArray(c.opts)&&c.opts.length>1;
 const opts=mc?c.opts.map((o,i)=>`<button class="opt" data-l="${L[i]}" onclick="choose(${i})">${L[i]}. ${esc(o)}</button>`).join(""):"";
 const at=mc?`${esc(c.a)}. ${esc(c.opts[L.indexOf(c.a)]||"")}`:esc(c.a);
 const btns=mc?`<button id="nx" class="p" style="display:none" onclick="nextC()">下一題 ▶</button>`
  :`<button class="p" onclick="$('ans').classList.add('on')">睇答案</button><button onclick="mark('ok')">✅ 識</button><button onclick="mark('no')">❌ 唔識</button>`;
 $("fc").innerHTML=`<div class="mut">${esc(c.cat)}</div><div class="q">${esc(c.q)}</div>${opts}
  <div class="a" id="ans">答案:${at}<div class="mut">出處:${esc(c.src||"未填")}</div></div><div class="btns">${btns}</div>`;
 $("fstat").textContent=`第 ${ci+1}/${deck.length} 張 · 總掌握 ${A.filter(x=>S.cards[x.id]==="ok").length}/${A.length}`}
function choose(i){if(locked)return;locked=true;
 const c=deck[ci],L="ABCD",ok=L[i]===c.a;S.cards[c.id]=ok?"ok":"no";save();
 document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.l===c.a)b.classList.add("good");else if(b.dataset.l===L[i])b.classList.add("bad")});
 $("ans").classList.add("on");$("nx").style.display="inline-block";
 if(ok&&S.auto)setTimeout(()=>{if(locked&&deck[ci]===c)nextC()},1200)}
function nextC(){ci=(ci+1)%deck.length;fcRender()}
function mark(v){S.cards[deck[ci].id]=v;save();ci=(ci+1)%deck.length;fcRender()}

/* ---------- 匯入習題 ---------- */
function parseQ(t){t=t.trim();
 if(t[0]=="[")return JSON.parse(t);
 return t.split(/\r?\n/).map(l=>l.split(/[|｜]/).map(x=>x.trim())).filter(p=>p.length>=3).map(p=>{
  const mc=/[;；]/.test(p[2])&&/^[A-Da-d]$/.test(p[3]||"");
  return mc?{cat:p[0],q:p[1],opts:p[2].split(/[;；]/).map(x=>x.trim()).filter(Boolean).slice(0,4),a:p[3].toUpperCase(),src:p[4]||""}
          :{cat:p[0],q:p[1],a:p[2],src:p[3]||""}})}
function doImp(){try{
 const rows=parseQ($("ib").value).filter(r=>{
  if(!r||!r.q||!r.a)return false;
  if(r.opts){const k="ABCD".indexOf(String(r.a).toUpperCase());return k>=0&&k<r.opts.length}
  return true});
 if(!rows.length)throw 0;
 const seen=new Set(all().map(c=>c.q));let n=0;
 rows.forEach(r=>{if(seen.has(r.q))return;seen.add(r.q);
  S.my.push({id:"u"+Date.now()+"_"+n++,cat:String(r.cat||"未分類"),q:String(r.q),a:String(r.a).toUpperCase()===String(r.a)&&r.opts?String(r.a).toUpperCase():String(r.a),
   opts:Array.isArray(r.opts)?r.opts.map(String):undefined,src:String(r.src||"")})});
 save();$("ib").value="";$("istat").textContent=`✅ 新增 ${n} 題(重複或答案字母唔啱嘅會跳過)`;initCats()
 }catch(e){$("istat").textContent="❌ 格式唔啱,冇匯入任何題目"}}
$("qf").onchange=async e=>{$("ib").value=await e.target.files[0].text();e.target.value=""};
function expMine(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S.my,null,1)]));a.download="我的習題.json";a.click()}
function clrMine(){if(confirm("清空所有匯入嘅習題?")){S.my=[];save();initCats()}}

/* ---------- PDF ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("s牌db",1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(mode,f){const db=await DB;return new Promise((res,rej)=>{const t=db.transaction("files",mode);const q=f(t.objectStore("files"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
$("pdf").onchange=async e=>{for(const f of e.target.files)await addPdf(f);e.target.value="";listMine()};
async function addPdf(file){
 try{const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf.slice(0)}).promise;const texts=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();
   texts.push(c.items.map(x=>x.str).join(" "));$("pstat").textContent=`讀取「${file.name}」 ${i}/${pdf.numPages}`}
  await tx("readwrite",s=>s.put({id:Date.now()+Math.random(),name:file.name,n:pdf.numPages,texts,buf}));
  const avg=texts.join("").length/pdf.numPages;
  $("pstat").textContent=avg<30?`⚠️ 「${file.name}」幾乎讀唔到文字,好可能係掃描圖片,搜尋唔會有用。`:`✅ 已存「${file.name}」`
 }catch(x){$("pstat").textContent="❌ 讀取失敗:"+x.message}}
async function listMine(){
 const fs=await tx("readonly",s=>s.getAll());
 $("files").innerHTML=fs.map(f=>`<div class="row"><b onclick="openPdf(${f.id},1)">${esc(f.name)}</b> <span class="mut">${f.n} 頁</span> <button onclick="del(${f.id})">刪除</button></div>`).join("")||'<p class="mut">未有檔案</p>';
 $("favs").innerHTML=S.fav.map(v=>`<div class="row" onclick="openPdf(${v.f},${v.p})">⭐ ${esc(v.name)} · 第 ${v.p} 頁</div>`).join("")||'<p class="mut">未有收藏</p>'}
async function del(id){if(!confirm("刪除呢個檔案?"))return;await tx("readwrite",s=>s.delete(id));S.fav=S.fav.filter(v=>v.f!=id);save();listMine()}
async function search(){
 const q=$("kw").value.trim().toLowerCase();if(!q)return;
 const fs=await tx("readonly",s=>s.getAll());const out=[];
 fs.forEach(f=>f.texts.forEach((t,i)=>{const j=t.toLowerCase().indexOf(q);
  if(j>=0)out.push({f:f.id,p:i+1,name:f.name,sn:t.slice(Math.max(0,j-20),j+70)})}));
 $("res").innerHTML=(out.length>50?`<p class="mut">只顯示頭 50 項,共 ${out.length} 項</p>`:"")+
  (out.slice(0,50).map(r=>`<div class="row" onclick="openPdf(${r.f},${r.p})"><b>${esc(r.name)} · 第 ${r.p} 頁</b><br><span class="mut">…${esc(r.sn)}…</span></div>`).join("")||'<p class="mut">搵唔到</p>')}
let cur=null;
async function openPdf(id,p){
 const f=await tx("readonly",s=>s.get(id));if(!f)return;
 cur={id,p,n:f.n,name:f.name,pdf:await pdfjsLib.getDocument({data:f.buf.slice(0)}).promise};
 $("view").style.display="flex";showPg()}
async function showPg(){
 const pg=await cur.pdf.getPage(cur.p),box=$("vbody"),w=box.clientWidth;
 const sc=w/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:sc*(devicePixelRatio||1)}),c=$("cv");
 c.width=v.width;c.height=v.height;c.style.width=w+"px";
 await pg.render({canvasContext:c.getContext("2d"),viewport:v}).promise;box.scrollTop=0;
 $("vt").textContent=`${cur.name} ${cur.p}/${cur.n}`;
 $("vs").textContent=S.fav.some(v=>v.f==cur.id&&v.p==cur.p)?"⭐":"☆"}
function mv(d){const p=cur.p+d;if(p<1||p>cur.n)return;cur.p=p;showPg()}
function favCur(){const i=S.fav.findIndex(v=>v.f==cur.id&&v.p==cur.p);
 i>=0?S.fav.splice(i,1):S.fav.push({f:cur.id,p:cur.p,name:cur.name});save();showPg()}
function closeV(){$("view").style.display="none";cur=null;listMine()}

/* ---------- 離線 ---------- */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
render();go(location.hash.slice(1)||"home");
</script>
</body>
</html>
